<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart SPT Logger</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        .header {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
        }

        .card h3 {
            color: #555;
        }

        .value {
            font-size: 30px;
            font-weight: bold;
        }

        .nvalue {
            grid-column: 1 / 3;
        }

        .status {
            background: white;
            margin-top: 20px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .nvalue {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>SMART SPT LOGGER</h1>
        <p>Digital Standard Penetration Test Monitoring System</p>
    </div>

    <div class="container">

        <h2>SPT Test Results</h2>

        <div class="cards">

            <div class="card">
                <h3>Depth</h3>
                <div class="value">45 cm</div>
            </div>

            <div class="card">
                <h3>Hammer Blow Count</h3>
                <div class="value">15</div>
            </div>

            <div class="card">
                <h3>N1</h3>
                <div class="value">5</div>
            </div>

            <div class="card">
                <h3>N2</h3>
                <div class="value">7</div>
            </div>

            <div class="card nvalue">
                <h3>SPT N-Value</h3>
                <div class="value">12</div>
            </div>

        </div>

        <div class="status">
            <h3>Test Status</h3>
            <div class="value">TEST COMPLETED</div>
        </div>

    </div>

</body>
</html>
