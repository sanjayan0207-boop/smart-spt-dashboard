<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart SPT Logger</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f8;
            color: #222;
        }

        .header {
            background: #1f4e79;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin: 10px 0 0;
            font-size: 17px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            display: block;
            width: 100%;
            margin: 0 0 25px 0;
            font-size: 26px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            min-height: 150px;
            padding: 25px;
            border-radius: 12px;
            text-align: center;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.10);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #555;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
            color: #1f4e79;
        }

        .unit {
            font-size: 16px;
            color: #777;
            margin-top: 5px;
        }

        .nvalue {
            grid-column: 1 / 3;
        }

        .nvalue .value {
            font-size: 42px;
        }

        .status {
            margin-top: 25px;
            background: #dff0d8;
            color: #286528;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }

        .footer {
            text-align: center;
            padding: 25px;
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .nvalue {
                grid-column: 1;
            }

            .header h1 {
                font-size: 26px;
            }

            .title {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Smart SPT Logger</h1>
        <p>Automated Standard Penetration Test Monitoring System</p>
    </div>

    <div class="container">

        <h2 class="title">SPT Test Results</h2>

        <div class="cards">

            <div class="card">
                <h3>Depth</h3>
                <div class="value" id="depth">--</div>
                <div class="unit">cm</div>
            </div>

            <div class="card">
                <h3>Blow Count</h3>
                <div class="value" id="blows">--</div>
                <div class="unit">blows</div>
            </div>

            <div class="card">
                <h3>N1</h3>
                <div class="value" id="n1">--</div>
                <div class="unit">blows</div>
            </div>

            <div class="card">
                <h3>N2</h3>
                <div class="value" id="n2">--</div>
                <div class="unit">blows</div>
            </div>

            <div class="card nvalue">
                <h3>SPT N-Value</h3>
                <div class="value" id="nvalue">--</div>
                <div class="unit">blows / 30 cm</div>
            </div>

        </div>

        <div class="status" id="status">
            CONNECTING...
        </div>

    </div>

    <div class="footer">
        Smart SPT Logger | Mining Engineering Design Project
    </div>


    <script>

        // ==========================================
        // PUT YOUR BLYNK AUTH TOKEN HERE
        // ==========================================

        const BLYNK_TOKEN = "txBNNxiUObwcaQVm-tDkDCBwLZDa2oKI";


        // ==========================================
        // BLYNK API FUNCTION
        // ==========================================

        async function getBlynkValue(pin) {

            const url =
                "https://blynk.cloud/external/api/get?token="
                + BLYNK_TOKEN
                + "&v"
                + pin;

            try {

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Blynk connection error");
                }

                const value = await response.text();

                return value;

            } catch (error) {

                console.log(error);

                return null;
            }
        }


        // ==========================================
        // UPDATE DASHBOARD
        // ==========================================

        async function updateDashboard() {

            const depth = await getBlynkValue(0);
            const blows = await getBlynkValue(1);
            const n1 = await getBlynkValue(2);
            const n2 = await getBlynkValue(3);
            const nvalue = await getBlynkValue(4);
            const status = await getBlynkValue(5);


            // Depth
            if (depth !== null) {
                document.getElementById("depth").innerText = depth;
            }


            // Blow Count
            if (blows !== null) {
                document.getElementById("blows").innerText = blows;
            }


            // N1
            if (n1 !== null) {
                document.getElementById("n1").innerText = n1;
            }


            // N2
            if (n2 !== null) {
                document.getElementById("n2").innerText = n2;
            }


            // N-value
            if (nvalue !== null) {
                document.getElementById("nvalue").innerText = nvalue;
            }


            // Status
            if (status !== null) {
                document.getElementById("status").innerText = status;

                if (status.toUpperCase().includes("COMPLETED")) {

                    document.getElementById("status").style.background =
                        "#dff0d8";

                    document.getElementById("status").style.color =
                        "#286528";

                } else {

                    document.getElementById("status").style.background =
                        "#fff3cd";

                    document.getElementById("status").style.color =
                        "#856404";
                }
            }
        }


        // ==========================================
        // UPDATE EVERY 2 SECONDS
        // ==========================================

        updateDashboard();

        setInterval(updateDashboard, 2000);

    </script>

</body>
</html>
