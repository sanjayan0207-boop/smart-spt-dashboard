<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart SPT Logger</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f8;
            color: #222;
        }

        .header {
            background: #1f4e79;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin: 10px 0 0;
            font-size: 17px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            display: block;
            width: 100%;
            margin: 0 0 25px 0;
            font-size: 26px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            min-height: 150px;
            padding: 25px;
            border-radius: 12px;
            text-align: center;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.10);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #555;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
            color: #1f4e79;
        }

        .unit {
            font-size: 16px;
            color: #777;
            margin-top: 5px;
        }

        .nvalue {
            grid-column: 1 / 3;
        }

        .nvalue .value {
            font-size: 42px;
        }

        .status {
            margin-top: 25px;
            background: #dff0d8;
            color: #286528;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }

        .footer {
            text-align: center;
            padding: 25px;
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .nvalue {
                grid-column: 1;
            }

            .header h1 {
                font-size: 26px;
            }

            .title {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Smart SPT Logger</h1>
        <p>Automated Standard Penetration Test Monitoring System</p>
    </div>

    <div class="container">

        <h2 class="title">SPT Test Results</h2>

        <div class="cards">

            <div class="card">
                <h3>Depth</h3>
                <div class="value">45</div>
                <div class="unit">cm</div>
            </div>

            <div class="card">
                <h3>Blow Count</h3>
                <div class="value">15</div>
                <div class="unit">blows</div>
            </div>

            <div class="card">
                <h3>N1</h3>
                <div class="value">5</div>
                <div class="unit">blows</div>
            </div>

            <div class="card">
                <h3>N2</h3>
                <div class="value">7</div>
                <div class="unit">blows</div>
            </div>

            <div class="card nvalue">
                <h3>SPT N-Value</h3>
                <div class="value">12</div>
                <div class="unit">blows / 30 cm</div>
            </div>

        </div>

        <div class="status">
            TEST COMPLETED
        </div>

    </div>

    <div class="footer">
        Smart SPT Logger | Mining Engineering Design Project
    </div>

</body>
</html>
